spring:
  application:
    name: sample-data-source
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always

  datasource:
    url: jdbc:mariadb://localhost:23306/app
    username: appuser
    password: appuser

#  datasource:
#    url: jdbc:h2:mem:sample;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

logging:
  level:
    com.revy.*: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace