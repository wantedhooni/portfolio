services:
  k3s:
    image: rancher/k3s:${K3S_VERSION}
    container_name: k3s-management
    privileged: true
    restart: unless-stopped
    command:
      - server
      - --write-kubeconfig=/etc/rancher/k3s/kubeconfig.yaml
      - --write-kubeconfig-mode=666
      - --tls-san=${RANCHER_HOSTNAME}
      - --tls-san=${ARGOCD_HOSTNAME}
    environment:
      K3S_TOKEN: rancher-argocd-local-token
      K3S_KUBECONFIG_OUTPUT: /etc/rancher/k3s/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "666"
    ports:
      - "80:80"
      - "443:443"
      - "6443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-config:/etc/rancher/k3s
      - /lib/modules:/lib/modules:ro

  bootstrap:
    build:
      context: ./bootstrap
    container_name: rancher-argocd-bootstrap
    depends_on:
      - k3s
    environment:
      RANCHER_HOSTNAME: ${RANCHER_HOSTNAME}
      ARGOCD_HOSTNAME: ${ARGOCD_HOSTNAME}
      RANCHER_BOOTSTRAP_PASSWORD: ${RANCHER_BOOTSTRAP_PASSWORD}
    volumes:
      - k3s-config:/kubeconfig:ro
      - ./bootstrap:/workspace
    restart: "no"

volumes:
  k3s-data:
  k3s-config: