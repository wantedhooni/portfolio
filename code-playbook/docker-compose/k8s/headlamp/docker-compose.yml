version: '3.8'

services:
  headlamp:
    image: ghcr.io/headlamp-k8s/headlamp:latest
    container_name: headlamp-web
    ports:
      - "4466:4466"
    volumes:
      # Mac의 쿠버네티스 인증 정보를 읽기 전용(ro)으로 연결
      - ~/.kube:/root/.kube:ro
      # (선택) Minikube 유저인 경우 인증서 경로 주석 해제 후 연결
      # - ~/.minikube:/root/.minikube:ro
    restart: unless-stopped
