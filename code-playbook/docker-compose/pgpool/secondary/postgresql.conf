# secondary/postgresql.conf
# PostgreSQL 16 - SECONDARY (Standby) 노드
#
# ★ Streaming Replication 규칙:
#   max_connections, max_worker_processes 등 일부 파라미터는
#   secondary 가 primary 보다 같거나 커야 기동 가능
#   (낮으면 FATAL: recovery aborted because of insufficient parameter settings)

listen_addresses = '*'
port = 5432
max_connections = 200           # primary 와 동일하게 유지 (필수)

# ── Standby 전용 ───────────────────────────────────────────────────────────────
# hot_standby = on : standby 상태에서 SELECT 쿼리 허용 (pgpool 읽기 분산 필수)
hot_standby = on

# primary 로부터 WAL 수신 중 conflict 발생 시 쿼리 취소 대기 시간
# 0 = 즉시 취소, -1 = 무한 대기
hot_standby_feedback = on       # primary 에 vacuum conflict 정보 전달 (롱쿼리 보호)

# ── 체크포인트 ─────────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ── 성능 (primary 와 동일하게 유지) ────────────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ── primary 전용 파라미터 (secondary 에서는 불필요, 명시적으로 비활성) ────────────
# wal_level, max_wal_senders, wal_keep_size 는 standby 에서 무시되지만
# pg_basebackup 으로 복사된 postgresql.auto.conf 에 primary_conninfo 가 있으므로
# 별도 설정 불필요

# ── 로깅 ───────────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning