server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1

# OpenAPI aggregation (Gateway Swagger UI 한 화면에서 서비스 선택)
springdoc:
  cache:
    disabled: true
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: user-service
        url: /user/v3/api-docs
      - name: order-service
        url: /order/v3/api-docs
  show-actuator: true

  logging:
    level:
      org.springframework.cloud.gateway: TRACE
      org.springframework.http.server.reactive: TRACE