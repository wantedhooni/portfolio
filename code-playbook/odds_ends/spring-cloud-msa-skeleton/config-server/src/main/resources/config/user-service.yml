server:
  port: 9001

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mariadb://mariadb:3306/userdb
    username: user
    password: userpass
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC

springdoc:
  show-actuator: true