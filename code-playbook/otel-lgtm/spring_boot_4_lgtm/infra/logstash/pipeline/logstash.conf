input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
    ecs_compatibility => "v8"
  }
}

filter {
  ##################################################################
  # 1. OTLP 배치 구조 분해
  #    resourceLogs[] -> scopeLogs[] -> logRecords[] 를 순차적으로
  #    펼쳐서 레코드 단위 이벤트로 만든다.
  ##################################################################
  split { field => "[resourceLogs]" }
  split { field => "[resourceLogs][scopeLogs]" }
  split { field => "[resourceLogs][scopeLogs][logRecords]" }

  ##################################################################
  # 2. resource.attributes 배열(key-value) -> flat hash 변환
  #    OTLP JSON 표준 스펙: attributes는
  #    [{ "key": "service.name", "value": { "stringValue": "..." } }, ...]
  #    형태의 배열이므로 sprintf 참조로 직접 접근이 불가능하다.
  ##################################################################
  ruby {
    code => '
      attrs = event.get("[resourceLogs][resource][attributes]")
      if attrs.is_a?(Array)
        attrs.each do |attr|
          key = attr["key"]
          value_hash = attr["value"] || {}
          value = value_hash["stringValue"] ||
                  value_hash["intValue"] ||
                  value_hash["boolValue"] ||
                  value_hash["doubleValue"]
          event.set("[resource_attrs][#{key}]", value) if key && value
        end
      end
    '
  }

  ##################################################################
  # 3. OTel nanosecond epoch -> Logstash @timestamp 변환
  ##################################################################
  ruby {
    code => '
      ts_nano = event.get("[resourceLogs][scopeLogs][logRecords][timeUnixNano]")
      if ts_nano
        event.set("@timestamp", Time.at(ts_nano.to_i / 1_000_000_000.0).utc)
      end
    '
  }

  ##################################################################
  # 4. data_stream 필드 생성 (flat hash 기준으로 접근)
  ##################################################################
  mutate {
    add_field => {
      "[data_stream][type]" => "logs"
      "[data_stream][dataset]" => "%{[resource_attrs][service.name]}"
      "[data_stream][namespace]" => "%{[resource_attrs][deployment.environment]}"
    }
  }

  # 매칭 실패(참조 필드 없음) 시 기본값 처리
  if [data_stream][dataset] == "%{[resource_attrs][service.name]}" {
    mutate { replace => { "[data_stream][dataset]" => "generic" } }
  }
  if [data_stream][namespace] == "%{[resource_attrs][deployment.environment]}" {
    mutate { replace => { "[data_stream][namespace]" => "default" } }
  }

  mutate {
    lowercase => [
      "[data_stream][dataset]",
      "[data_stream][namespace]"
    ]

    # data stream 이름 제약: 소문자/숫자/언더스코어 외 전부 치환
    gsub => [
      "[data_stream][dataset]", "[^a-z0-9_]", "_",
      "[data_stream][namespace]", "[^a-z0-9_]", "_"
    ]
  }
}

output {
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    ecs_compatibility => "v8"

    data_stream => "true"
    data_stream_auto_routing => true
    data_stream_sync_fields => true

    action => "create"
  }
}