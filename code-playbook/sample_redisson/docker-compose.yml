services:
  redis:
    image: redis:7.2
    container_name: sample-redisson-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis1234
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  redis-data:
