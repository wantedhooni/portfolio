<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        .actions { display: flex; gap: 8px; }
        a, button { padding: 6px 12px; text-decoration: none; border: 1px solid #444; border-radius: 4px; background: #fff; }
        button { cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="header">
    <h1>게시글 목록</h1>
    <a th:href="@{/posts/new}">새 게시글</a>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>제목</th>
        <th>등록일</th>
        <th>액션</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(posts)}">
        <td colspan="4">등록된 게시글이 없습니다.</td>
    </tr>
    <tr th:each="post : ${posts}">
        <td th:text="${post.id}"></td>
        <td>
            <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a>
        </td>
        <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td class="actions">
            <a th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
