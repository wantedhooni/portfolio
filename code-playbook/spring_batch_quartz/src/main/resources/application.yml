spring:
  application:
    name: spring-batch-quartz
  datasource:
    url: jdbc:mariadb://localhost:23306/batch_quartz
    username: appuser
    password: appuser
    driver-class-name: org.mariadb.jdbc.Driver

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
            instanceName: batchQuartzScheduler
          jobStore:
            #class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: 20000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus, quartz
  metrics:
    tags:
      application: ${spring.application.name}
    quartz:
      enabled: true

app:
  batch:
    job-name: sampleJob
    retry:
      limit: 3
      backoff:
        initial: 500
        multiplier: 2.0
        max: 5000
  quartz:
    cron: "0 */1 * * * ?"
  alert:
    slack-webhook-url: https://hooks.slack.com/services/your/webhook
    email-to: ops@example.com
    webhook-url: https://example.com/webhook

quartz-manager:
  oas:
    enabled: true