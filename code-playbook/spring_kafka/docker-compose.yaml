services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka-3_8
    hostname: kafka

    ports:
      - "9092:9092"     # 호스트(로컬) 클라이언트용
      - "29092:29092"   # 도커 내부 클라이언트용
      - "9093:9093"     # KRaft controller

    environment:
      # ===== KRaft 기본 =====
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CLUSTER_ID: "R2p7b3n9TQe0mWq1Zk8cJg"

      # ===== Listener =====
      # EXTERNAL: 호스트에서 접근 (localhost:9092)
      # INTERNAL: 도커 네트워크에서 접근 (kafka:29092)
      # CONTROLLER: KRaft 메타데이터 컨트롤러 (kafka:9093)
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:29092"

      # 브로커 내부 통신(Inter-broker)은 INTERNAL 사용 권장
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Listener 이름 ↔ 보안 프로토콜 매핑 (개발용 PLAINTEXT)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # KRaft Controller 설정
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # ===== 단일 브로커 필수 값 =====
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: "local-kafka-3.8"
      # 도커 내부에서 Kafka로 붙으므로 INTERNAL 리스너 사용
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"

    depends_on:
      - kafka

volumes:
  kafka-data:
