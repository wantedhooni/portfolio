spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    hibernate:
      #      ddl-auto: validate   # 운영: validate / none, 로컬: update (개발 초기에만)
      ddl-auto: update
    open-in-view: false    # 실무에서는 false 권장 (OSIV 비활성화)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace