plugins {
  id 'java'
  // 1. Spring Boot 버전 유지
  id 'org.springframework.boot' version '3.5.16' apply false
  // 2. 중요: Gradle 최신화 호환성을 위해 dependency-management 버전을 1.1.6 이상으로 업그레이드
  id 'io.spring.dependency-management' version '1.1.7' apply false
  // 3. Jib 플러그인 버전 유지
  id 'com.google.cloud.tools.jib' version '3.4.2' apply false
}

allprojects {
  repositories {
    mavenCentral()
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'io.spring.dependency-management'

  // 4. 모든 서브모듈에 Spring Boot 의존성 관리 기능(BOM) 강제 적용
  // 이 설정이 누락되면 하위 모듈에서 스프링 라이브러리 버전 버그가 날 수 있습니다.
  dependencyManagement {
    imports {
      mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.0"
    }
  }

  dependencies {

  }
  // 모든 서브모듈의 Java 21 설정
  java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
  }

  tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
  }

  tasks.named('test') {
    useJUnitPlatform()
  }
}
