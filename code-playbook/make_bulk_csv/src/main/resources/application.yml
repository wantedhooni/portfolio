spring:
  application:
    name: bulk-test-sample
  datasource:
    url: jdbc:mariadb://localhost:23306/bulk_sample
    username: appuser
    password: appuser
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            instanceName: bulkScheduler
          threadPool:
            threadCount: 5

bulk:
  export:
    fetch-size: 5000
    output-filename-prefix: "users-export"

logging:
  level:
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # Hibernate 6+