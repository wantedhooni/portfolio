# order-service/src/main/resources/application.yml
server:
  port: 8082
spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
---
spring:
  config:
    activate:
      on-profile: k8s
eureka:
  client:
    enabled: false