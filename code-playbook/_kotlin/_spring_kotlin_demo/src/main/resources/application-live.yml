spring:
  datasource:
    url: jdbc:postgresql://live-db-host:5432/demo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000

  kafka:
    bootstrap-servers: live-kafka-host:9092
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  boot:
    admin:
      client:
        url: http://live-admin-host:8080
        instance:
          name: ${spring.application.name}-live
          prefer-ip: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.05
  metrics:
    export:
      otlp:
        enabled: true
        url: http://otel-collector-host:4318/v1/metrics

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20

logging:
  level:
    root: WARN
    com.revy: INFO
