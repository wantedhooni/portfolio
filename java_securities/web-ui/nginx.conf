server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # 공통: 캐시 완전 비활성화 헤더
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;

  # 정적 리소스(/assets)는 fallback 금지 + 캐시 금지
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;

    # 혹시 상위 add_header가 location에서 무시되는 경우 대비(nginx 특성상 명시 권장)
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # (선택) favicon/robots도 캐시 금지 + fallback 금지
  location = /favicon.ico { try_files $uri =404; access_log off; }
  location = /robots.txt  { try_files $uri =404; access_log off; }

  # SPA 라우팅
  location / {
    try_files $uri $uri/ /index.html;
  }
}