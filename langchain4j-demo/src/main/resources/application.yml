spring:
  application:
    name: langchain4j-demo
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://localhost:3306/langchain4j_db
    username: root
    password: your-password
    driver-class-name: com.mysql.cj.jdbc.Driver

# Ollama 설정 (로컬 LLM)
ollama:
  base-url: http://localhost:11434
  model-name: mistral  # 또는 llama2, neural-chat 등
  temperature: 0.7
  timeout: 120  # 초 단위
  keep-alive: 5m