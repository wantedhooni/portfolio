spring:
  datasource:
    url: jdbc:postgresql://dev-db-host:5432/demo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  kafka:
    bootstrap-servers: dev-kafka-host:9092

  boot:
    admin:
      client:
        url: http://dev-admin-host:8080
        instance:
          name: ${spring.application.name}-dev
          prefer-ip: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers, env
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  metrics:
    export:
      otlp:
        enabled: true
        url: http://otel-collector-host:4318/v1/metrics

server:
  port: 8080

logging:
  level:
    root: INFO
    com.revy: DEBUG
    org.hibernate.SQL: DEBUG
