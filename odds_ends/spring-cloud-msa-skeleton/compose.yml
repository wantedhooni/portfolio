services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "43306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -prootpass --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  discovery-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth-service
    container_name: auth-service
    ports:
      - "9000:9000"
    environment:
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/actuator/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.user-service
    container_name: user-service
    ports:
      - "9001:9001"
    environment:
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9001/actuator/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.order-service
    container_name: order-service
    ports:
      - "9002:9002"
    environment:
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9002/actuator/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: optional:configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      auth-service:
        condition: service_healthy
        restart: true
      user-service:
        condition: service_healthy
        restart: true
      order-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

volumes:
  mariadb_data:
