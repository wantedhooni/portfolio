server:
  forward-headers-strategy: framework
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,prometheus

springdoc:
  show-actuator: true
