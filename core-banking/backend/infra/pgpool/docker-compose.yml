version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL 16 Primary/Secondary + pgpool-II 4.7.1 + pgpoolAdmin
#
# 포트 요약
#   5431 → pgpool      앱 단일 진입점 (읽기·쓰기 자동 분산)
#   5432 → primary     DBA 직접 접속
#   5433 → secondary   DBA 직접 접속
#   9898 → pcp         pgpool 관리 CLI
# ─────────────────────────────────────────────────────────────────────────────

networks:
  pg_network:
    driver: bridge

volumes:
  pg_primary_data:
  pg_secondary_data:

services:

  # ── PRIMARY ────────────────────────────────────────────────────────────────
  pg_primary:
    image: postgres:16-alpine
    container_name: pg_primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./primary/init:/docker-entrypoint-initdb.d
      - ./primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SECONDARY ─────────────────────────────────────────────────────────────
  pg_secondary:
    image: postgres:16-alpine
    container_name: pg_secondary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # pg_basebackup 접속 정보 (init-replica.sh 에서 참조)
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_secret
      POSTGRES_PRIMARY_HOST: pg_primary
      POSTGRES_PRIMARY_PORT: 5432
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - pg_secondary_data:/var/lib/postgresql/data
      - ./secondary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./secondary/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    command: ["bash", "/usr/local/bin/init-replica.sh"]
    user: "0:0"
    depends_on:
      pg_primary:
        condition: service_healthy
    networks:
      - pg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PGPOOL-II ──────────────────────────────────────────────────────────────
  pgpool:
    image: sourcemation/pgpool:4.7.1
    container_name: pgpool
    restart: always
    environment:
      # pool_passwd 등록: *_USERNAME / *_PASSWORD 쌍 자동 인식
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      REPLICATOR_USERNAME: replicator
      REPLICATOR_PASSWORD: replicator_secret
      PGPOOL_PASSWORD_ENCRYPTION_METHOD: scram-sha-256
      # pcp 관리 유저 (pgpoolAdmin 이 pcp 를 통해 pgpool 에 접속)
      PGPOOL_PCP_USER: pgpool_admin
      PGPOOL_PCP_PASSWORD: pgpool_admin_secret
      PGPOOL_CONF_VOLUME: /config
    ports:
      - "5431:5432"
      - "9898:9898"
    volumes:
      - ./pgpool/pgpool.conf:/config/pgpool.conf
      - ./pgpool/pool_hba.conf:/config/pool_hba.conf
    depends_on:
      pg_primary:
        condition: service_healthy
      pg_secondary:
        condition: service_healthy
    networks:
      - pg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d appdb"]
      interval: 15s
      timeout: 5s
      retries: 5