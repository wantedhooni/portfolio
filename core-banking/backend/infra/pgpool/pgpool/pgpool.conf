# pgpool/pgpool.conf
# sourcemation/pgpool:4.7.1 - 파일 우선 모드
#
# ★ 이 파일이 PGPOOL_CONF_VOLUME(/config)에 존재하면
#   entrypoint.sh 가 PGPOOL_PARAMS_* 환경변수를 무시하고 이 파일을 그대로 사용한다.
#   → backend_hostname0 등 모든 파라미터를 이 파일 안에 직접 작성해야 한다.

# ── 기본 접속 ─────────────────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
socket_dir = '/var/run/pgpool'
pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/var/run/pgpool'

# ── 백엔드 노드 ───────────────────────────────────────────────────────────────
backend_hostname0 = 'pg_primary'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALWAYS_PRIMARY|ALLOW_TO_FAILOVER'

backend_hostname1 = 'pg_secondary'
backend_port1 = 5432
backend_weight1 = 2                       # READ 쿼리 분산 비중 (secondary 우선)
backend_data_directory1 = '/var/lib/postgresql/data'
backend_flag1 = 'ALLOW_TO_FAILOVER'

# ── 운영 모드 ─────────────────────────────────────────────────────────────────
backend_clustering_mode = 'streaming_replication'

# ── 커넥션 풀 ─────────────────────────────────────────────────────────────────
num_init_children = 32          # 최대 동시 클라이언트 수
max_pool = 4                    # 프로세스당 캐시 DB 커넥션 수
                                # 총 DB 커넥션 = 32 × 4 = 128
                                # PostgreSQL max_connections(200) 보다 작게 유지
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0
connection_cache = on
reset_query_list = 'ABORT; DISCARD ALL'

# ── 로드 밸런싱 ───────────────────────────────────────────────────────────────
load_balance_mode = on

# ── Streaming Replication 체크 ─────────────────────────────────────────────────
sr_check_period = 10
sr_check_user = 'replicator'
sr_check_password = 'replicator_secret'
sr_check_database = 'appdb'

# ── 헬스체크 ──────────────────────────────────────────────────────────────────
health_check_period = 10
health_check_timeout = 5
health_check_user = 'postgres'
health_check_password = 'postgres'
health_check_database = 'appdb'
health_check_max_retries = 3
health_check_retry_delay = 1

# ── 페일오버 ──────────────────────────────────────────────────────────────────
failover_on_backend_error = on

# ── 인증 ──────────────────────────────────────────────────────────────────────
enable_pool_hba = on            # pool_hba.conf 사용

# ── 로그 ──────────────────────────────────────────────────────────────────────
log_connections = on
log_disconnections = on
log_statement = off
log_min_messages = warning
log_replication_commands = on
