spring:
  application:
    name: api-saas
  profiles:
    active: ${APP_PROFILE:local}
    default: local
  config:
    import:
      - "optional:classpath:/metrics.yml"
      - "optional:classpath:/springdoc.yml"
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5431/appdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 1
#      password: ${REDIS_PASSWORD:mypassword}
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    #virtual thread
    threads:
      virtual:
        enabled: true

server:
  port: ${ADMIN_SERVER_PORT:8091}

app:
  jwt:
    issuer: ${JWT_ISSUER:api-saas}
    secret: ${JWT_SECRET:70e0335e49b479a2d2f328fae1cc61030933029a529c44f7aad0997e171d34372d8cddf5edc24db99d41d9d802a160959890a593151a357fa225b71b986ec223}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

logging:
  level:
    org.hibernate.SQL: debug
