<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .meta { color: #666; margin-bottom: 20px; }
        .actions { margin-top: 20px; display: flex; gap: 8px; }
        a, button { padding: 6px 12px; text-decoration: none; border: 1px solid #444; border-radius: 4px; background: #fff; }
        button { cursor: pointer; }
    </style>
</head>
<body>
<h1 th:text="${post.title}"></h1>
<div class="meta">
    <div>등록일: <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span></div>
    <div>수정일: <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></div>
</div>
<p th:text="${post.content}"></p>
<div class="actions">
    <a th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
        <button type="submit">삭제</button>
    </form>
    <a th:href="@{/posts}">목록으로</a>
</div>
</body>
</html>
