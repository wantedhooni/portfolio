version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    container_name: es7
    environment:
      - node.name=es7-node
      - cluster.name=es7-docker-cluster
      - discovery.type=single-node

      # 메모리(로컬 기준 예시)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

      # 개발 편의(보안 비활성)
      - xpack.security.enabled=false

      # (선택) 네트워크 바인딩
      - network.host=0.0.0.0
      - http.port=9200
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es7-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.24
    container_name: kibana7
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es7-data: