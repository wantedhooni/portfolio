services:
  mariadb-primary:
    image: mariadb:11.4
    container_name: mariadb-primary
    restart: unless-stopped
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --read-only=OFF
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: appdb
      MARIADB_USER: app
      MARIADB_PASSWORD: apppass
    ports:
      - "33061:3306"
    volumes:
      - primary-data:/var/lib/mysql
      - ./primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - dbnet

  mariadb-replica:
    image: mariadb:11.4
    container_name: mariadb-replica
    restart: unless-stopped
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --log-slave-updates=ON
      - --read-only=ON
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_PRIMARY_ROOT_PASSWORD: rootpass
    ports:
      - "33062:3306"
    volumes:
      - replica-data:/var/lib/mysql
      - ./replica-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - dbnet

  proxysql:
    image: proxysql/proxysql:3.0
    container_name: proxysql
    restart: unless-stopped
    ports:
      - "6033:6033" # application MySQL endpoint
      - "6032:6032" # ProxySQL admin endpoint
    volumes:
      - ./proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
      - proxysql-data:/var/lib/proxysql
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
    networks:
      - dbnet

volumes:
  primary-data:
  replica-data:
  proxysql-data:

networks:
  dbnet:
    driver: bridge