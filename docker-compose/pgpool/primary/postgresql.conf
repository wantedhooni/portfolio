# primary/postgresql.conf
# PostgreSQL 16 - PRIMARY 노드 설정

# ── 기본 접속 ─────────────────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 200           # pgpool num_init_children × max_pool(128) 보다 크게 유지

# ── WAL / 스트리밍 복제 ───────────────────────────────────────────────────────
wal_level = replica             # 스트리밍 복제 필수
max_wal_senders = 5             # secondary 최대 동시 연결 수
wal_keep_size = 256MB           # secondary 지연 시 WAL 보존량
wal_log_hints = on              # pg_rewind 지원 (페일오버 후 재동기화)

# ── 체크포인트 ────────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ── 성능 (서버 메모리에 맞게 조정) ────────────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ── 로깅 ──────────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_replication_commands = on
