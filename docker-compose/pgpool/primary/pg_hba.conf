# primary/pg_hba.conf
# PostgreSQL 16 - PRIMARY 클라이언트 인증

# TYPE  DATABASE     USER        ADDRESS       METHOD

# 컨테이너 내부 로컬
local   all          all                       trust

# 앱 / pgpool 접속 (docker network)
host    all          all         0.0.0.0/0     scram-sha-256

# 복제 전용 유저 (secondary → primary WAL 수신)
host    replication  replicator  0.0.0.0/0     scram-sha-256
