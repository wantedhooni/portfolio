version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger-all-in-one
    environment:
      - COLLECTOR_OTLP_ENABLED=true # OpenTelemetry(OTLP) 수집 활성화
    ports:
      - "16686:16686"   # Jaeger UI 웹 포트 (브라우저 접속용)
      - "4317:4317"     # OpenTelemetry gRPC 수집 포트 (Spring Boot 연동 시 권장)
      - "4318:4318"     # OpenTelemetry HTTP 수집 포트
      - "14250:14250"   # Jaeger 모델 전송용 포트 (gRPC)
      - "14268:14268"   # Jaeger 모델 전송용 포트 (HTTP)
      - "9411:9411"     # Zipkin 호환용 포트 (필요 시)
    restart: always