version: '3.8'

services:
  # Kiali Web UI
  kiali:
    image: jorgemoralespou/kiali-html:latest # 독립 실행 및 UI 테스트용 이미지 (또는 quay.io/kiali/kiali:v1.89)
    container_name: kiali
    ports:
      - "20001:20001"
    environment:
      - AUTH_STRATEGY=anonymous # 로그인 절차 없이 접근하도록 설정 (테스트용)
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      - prometheus
    networks:
      - kiali-network

  # Kiali가 메트릭을 읽어올 Prometheus (필수 의존성)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - kiali-network

networks:
  kiali-network:
    driver: bridge