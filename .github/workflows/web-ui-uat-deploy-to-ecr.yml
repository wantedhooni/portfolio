name: Build & Push to ECR (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "WEB UI 배포할 브랜치/태그 (기본: deploy)"
        required: false
        default: "deploy"
      image_tag:
        description: "추가 태그 (비우면 SHA + latest만 푸시)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Access Key 방식
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          SHA_TAG: ${{ github.sha }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          pwd
          cd web-ui
          pwd
          ls -al
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # Docker tag 안전하게 정규화: 소문자, @ 제거, / -> -, 공백 제거
          SAFE_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/@//g' | sed 's/\//-/g' | tr -d ' ')
          SAFE_VERSION=$(echo "$VERSION" | tr -d ' ')
          IMAGE_TAG=${SAFE_NAME}-${SAFE_VERSION}
          
          echo "safe_name=$SAFE_NAME"
          echo "safe_version=$SAFE_VERSION"
          echo "$IMAGE_TAG"
          
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          if [ -n "$EXTRA_TAG" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$EXTRA_TAG
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$EXTRA_TAG
          fi
