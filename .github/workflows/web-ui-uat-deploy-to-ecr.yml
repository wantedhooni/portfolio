name: Build & Push to ECR (manual)

on:
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Access Key 방식
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          git branch --show-current
          pwd
          cd web-ui

          # Docker tag 안전하게 정규화: 소문자, @ 제거, / -> -, 공백 제거
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SAFE_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/@//g' | sed 's/\//-/g' | tr -d ' ')
          SAFE_VERSION=$(echo "$VERSION" | tr -d ' ')

          # 기본 태그: {name}-{version}
          IMAGE_TAG="${SAFE_NAME}-${SAFE_VERSION}"

          # 사용자가 추가 태그를 넣으면 덮어쓰기(옵션)
          if [ -n "${EXTRA_TAG}" ]; then
            IMAGE_TAG="${EXTRA_TAG}"
          fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "SAFE_NAME=$SAFE_NAME"
          echo "SAFE_VERSION=$SAFE_VERSION"
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          # latest도 같이 푸시(선택)
          docker tag "$IMAGE_URI" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          # 다음 step에서 쓰도록 outputs로 노출
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # (중요) ECS Task Definition JSON 내 containerName을 지정해서 이미지 교체
      - name: Render ECS task definition (inject new image)
        id: render_task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ secrets.ECS_TASK_DEFINITION_PATH }} # 예: .aws/task-def.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}         # 예: web-ui
          image: ${{ steps.build_image.outputs.image_uri }}

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render_task_def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true