name: Build & Push to ECR + Deploy to ECS (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra tag. If empty, uses pkg name+version."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          cd web-ui

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SAFE_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/@//g' | sed 's/\//-/g' | tr -d ' ')
          SAFE_VERSION=$(echo "$VERSION" | tr -d ' ')

          IMAGE_TAG="${SAFE_NAME}-${SAFE_VERSION}"
          if [ -n "${EXTRA_TAG}" ]; then IMAGE_TAG="${EXTRA_TAG}"; fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          docker tag "$IMAGE_URI" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
      # 1) 서비스에서 PRIMARY deployment의 taskDefinition ARN 가져오기
      - name: Get PRIMARY task definition ARN from service
        id: get_td
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail
      
          TD_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'] | [0].taskDefinition" \
            --output text)
      
          if [ -z "$TD_ARN" ] || [ "$TD_ARN" = "None" ]; then
            echo "ERROR: PRIMARY taskDefinition not found."
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query "{services:services,failures:failures}" --output json
            exit 1
          fi
      
          echo "TD_ARN=$TD_ARN"
          echo "task_def_arn=$TD_ARN" >> "$GITHUB_OUTPUT"
          echo "TASK_DEF=$TD_ARN" >> "$GITHUB_ENV"
      
      - name: Debug container names in taskdef.json
        run: |
          set -euo pipefail
          echo "=== containerDefinitions[].name from taskdef.json ==="
          jq -r '.containerDefinitions[].name' taskdef.json

          echo "=== full containerDefinitions (name, image) ==="
          jq -r '.containerDefinitions[] | "\(.name) -> \(.image)"' taskdef.json

      # 2) 해당 Task Definition을 내려받아 register 가능한 형태로 정리(sanitize)
      - name: Download task definition JSON (sanitized)
        run: |
          set -euo pipefail
      
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query "taskDefinition" \
            --output json > taskdef.raw.json
      
          jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' taskdef.raw.json > taskdef.json
      
          echo "Generated taskdef.json"
          ls -al taskdef.json
      

      # 3) 컨테이너 이미지 치환 (Action 사용)
      - name: Render ECS task definition (inject new image)
        id: render_task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ steps.build_image.outputs.image_uri }}

      # 4) 서비스 배포
      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render_task_def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
