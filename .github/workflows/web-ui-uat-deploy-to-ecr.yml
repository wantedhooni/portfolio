name: Build & Push to ECR + Deploy to ECS (manual, CLI)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional tag override (e.g. hotfix-1). Empty = pkg name+version"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          cd web-ui

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SAFE_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/@//g' | sed 's/\//-/g' | tr -d ' ')
          SAFE_VERSION=$(echo "$VERSION" | tr -d ' ')

          IMAGE_TAG="${SAFE_NAME}-${SAFE_VERSION}"
          if [ -n "${EXTRA_TAG}" ]; then IMAGE_TAG="${EXTRA_TAG}"; fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          docker tag "$IMAGE_URI" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # 1) PRIMARY taskDefinition ARN 조회 (네 케이스: deployments[].taskDefinition)
      - name: Get PRIMARY task definition ARN from service
        id: get_td
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail

          TD_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'] | [0].taskDefinition" \
            --output text)

          if [ -z "$TD_ARN" ] || [ "$TD_ARN" = "None" ]; then
            echo "ERROR: PRIMARY taskDefinition not found."
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query "{services:services,failures:failures}" --output json
            exit 1
          fi

          echo "BASE_TASK_DEF_ARN=$TD_ARN" >> "$GITHUB_ENV"
          echo "BASE_TASK_DEF_ARN=$TD_ARN"

      # 2) 기존 task definition 내려받기 (taskDefinition만)
      - name: Download base task definition JSON
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK_DEF_ARN" \
            --query "taskDefinition" \
            --output json > "$GITHUB_WORKSPACE/taskdef.base.json"

          echo "Downloaded: taskdef.base.json"
          ls -al "$GITHUB_WORKSPACE/taskdef.base.json"

      # 3) container-name 검증 (secret 값이 실제로 존재하는지)
      - name: Validate ECS_CONTAINER_NAME exists
        run: |
          set -euo pipefail
          echo "ECS_CONTAINER_NAME=${{ secrets.ECS_CONTAINER_NAME }}"
          echo "Available containers:"
          jq -r '.containerDefinitions[].name' "$GITHUB_WORKSPACE/taskdef.base.json"
          jq -e --arg CN "${{ secrets.ECS_CONTAINER_NAME }}" \
            '.containerDefinitions[].name | select(. == $CN)' \
            "$GITHUB_WORKSPACE/taskdef.base.json" > /dev/null

      # 4) 이미지 치환 + register에 불필요한 키 제거(sanitize)
      - name: Create task definition for registration (inject image + sanitize)
        id: make_td
        env:
          CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
          NEW_IMAGE: ${{ steps.build_image.outputs.image_uri }}
        run: |
          set -euo pipefail

          # 4-1) 이미지 치환
          jq --arg CN "$CONTAINER_NAME" --arg IMG "$NEW_IMAGE" '
            .containerDefinitions = (
              .containerDefinitions
              | map(if .name == $CN then (.image = $IMG) else . end)
            )
          ' "$GITHUB_WORKSPACE/taskdef.base.json" > "$GITHUB_WORKSPACE/taskdef.injected.json"

          # 4-2) register-task-definition에서 거부되는/불필요한 읽기전용 필드 제거
          # (안전하게 key를 광범위하게 제거 + enableFaultInjection도 전역 제거)
          jq '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | del(.. | .enableFaultInjection?)
          ' "$GITHUB_WORKSPACE/taskdef.injected.json" > "$GITHUB_WORKSPACE/taskdef.register.json"

          echo "Prepared: taskdef.register.json"
          ls -al "$GITHUB_WORKSPACE/taskdef.register.json"

      # 5) 새 task definition revision 등록
      - name: Register new task definition (CLI)
        id: register_td
        run: |
          set -euo pipefail
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$GITHUB_WORKSPACE/taskdef.register.json" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_TD_ARN" >> "$GITHUB_ENV"
          echo "NEW_TASK_DEF_ARN=$NEW_TD_ARN"
          echo "new_task_def_arn=$NEW_TD_ARN" >> "$GITHUB_OUTPUT"

      # 6) 서비스 업데이트 (새 revision으로)
      - name: Update ECS service to new task definition (CLI)
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment

      # 7) 안정화 대기
      - name: Wait for service stability
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
