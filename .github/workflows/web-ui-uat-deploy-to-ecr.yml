name: Build & Push to ECR + Deploy to ECS (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra tag. If empty, uses pkg name+version."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          cd web-ui

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SAFE_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/@//g' | sed 's/\//-/g' | tr -d ' ')
          SAFE_VERSION=$(echo "$VERSION" | tr -d ' ')

          IMAGE_TAG="${SAFE_NAME}-${SAFE_VERSION}"
          if [ -n "${EXTRA_TAG}" ]; then IMAGE_TAG="${EXTRA_TAG}"; fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          docker tag "$IMAGE_URI" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # PRIMARY taskDefinition ARN 조회
      - name: Get PRIMARY task definition ARN from service
        id: get_td
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail
          TD_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'] | [0].taskDefinition" \
            --output text)

          if [ -z "$TD_ARN" ] || [ "$TD_ARN" = "None" ]; then
            echo "ERROR: PRIMARY taskDefinition not found."
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query "{services:services,failures:failures}" --output json
            exit 1
          fi

          echo "TASK_DEF=$TD_ARN" >> "$GITHUB_ENV"
          echo "TD_ARN=$TD_ARN"

      # Task Definition JSON 덤프 + sanitize (항상 workspace 루트에 생성)
      - name: Download task definition JSON (sanitized)
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query "taskDefinition" \
            --output json > "$GITHUB_WORKSPACE/taskdef.raw.json"

          jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' "$GITHUB_WORKSPACE/taskdef.raw.json" > "$GITHUB_WORKSPACE/taskdef.json"

          echo "Generated: $GITHUB_WORKSPACE/taskdef.json"
          ls -al "$GITHUB_WORKSPACE/taskdef.json"

      # (선택) 컨테이너 이름 검증 로그
      - name: Debug container names (validate ECS_CONTAINER_NAME)
        run: |
          set -euo pipefail
          echo "ECS_CONTAINER_NAME=${{ secrets.ECS_CONTAINER_NAME }}"
          echo "Available container names:"
          jq -r '.containerDefinitions[].name' "$GITHUB_WORKSPACE/taskdef.json"

      # ✅ ECS_CONTAINER_NAME 사용
      - name: Render ECS task definition (inject new image)
        id: render_task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ github.workspace }}/taskdef.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ steps.build_image.outputs.image_uri }}

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render_task_def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true