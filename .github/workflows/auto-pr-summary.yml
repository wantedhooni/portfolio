name: Auto PR Summary in Korean

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr_diff.txt

      - name: Generate Korean PR Summary with Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "
          다음 PR diff를 분석해서 한국어로 PR 요약을 작성해줘.

          형식:
          ## 🤖 AI 생성 PR 요약

          ### 변경 요약
          - 핵심 변경사항 3~5개

          ### 영향 범위
          - 영향을 받는 모듈, API, UI, DB, 설정 등

          ### 리뷰 포인트
          - 리뷰어가 중점적으로 봐야 할 부분

          ### 테스트 관점
          - 확인해야 할 테스트 항목

          아래 파일을 입력으로 사용:
          /tmp/pr_diff.txt

          결과를 /tmp/pr_summary.md 파일로 저장해줘.
          " \
          --allow-tool='shell(cat:*)' \
          --allow-tool=write \
          --no-ask-user

      - name: Comment PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr_summary.md
